<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abdul AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #131314;
      color: #e3e3e3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Styling */
    #sidebar {
      width: 260px;
      background-color: #1e1f20;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2d2f31;
      transition: all 0.3s ease;
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .new-chat-btn {
      background-color: #2b2c2e;
      color: #fff;
      border: 1px solid #444746;
      border-radius: 20px;
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      font-weight: 500;
    }

    .new-chat-btn:hover {
      background-color: #37393b;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid #2d2f31;
      font-size: 12px;
      color: #8e918f;
    }

    /* Main Content Area */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2d2f31;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      color: #e3e3e3;
    }

    /* Chat Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }

    .user-avatar {
      background-color: #004a77;
      color: #c2e7ff;
    }

    .ai-avatar {
      background-color: #005c4b;
      color: #a8f5e2;
    }

    .message-content {
      line-height: 1.6;
      font-size: 15px;
      color: #e3e3e3;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-media {
      max-width: 300px;
      max-height: 300px;
      border-radius: 8px;
      margin-top: 8px;
    }

    /* Input Controls */
    .input-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px 24px 24px;
    }

    .input-box {
      background-color: #1e1f20;
      border: 1px solid #444746;
      border-radius: 24px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-box:focus-within {
      border-color: #a8c7fa;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e3e3e3;
      font-size: 15px;
      resize: none;
      height: 24px;
      max-height: 150px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #c4c7c5;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background-color: #2b2c2e;
      color: #e3e3e3;
    }

    #file-preview {
      display: none;
      padding: 8px 12px;
      background-color: #2b2c2e;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      align-items: center;
      justify-content: space-between;
    }

    /* Starter Screen */
    .starter-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    .starter-title {
      font-size: 32px;
      font-weight: 500;
      background: linear-gradient(90deg, #4285f4, #9b51e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="startNewChat()">
        <span>+</span> New Chat
      </button>
    </div>
    <div class="chat-history" id="chat-history"></div>
    <div class="sidebar-footer">
      Created by <b>Abdul Samad</b><br>
      Powered by <b>Abdul AI</b>
    </div>
  </div>

  <!-- Main Area -->
  <div id="main-content">
    <header>
      <div class="app-title">Abdul AI</div>
    </header>

    <div id="chat-container">
      <div class="starter-screen" id="starter-screen">
        <div class="starter-title">Hello, I am Abdul AI</div>
        <p style="color: #8e918f;">How can I help you today?</p>
      </div>
    </div>

    <div class="input-container">
      <div id="file-preview">
        <span id="file-name">Selected File</span>
        <button class="icon-btn" onclick="removeFile()">✕</button>
      </div>
      <div class="input-box">
        <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Attach Image/Audio/Video/File">
          📎
        </button>
        <textarea id="user-input" placeholder="Ask Abdul AI..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button class="icon-btn" onclick="sendMessage()" title="Send">
          ➔
        </button>
      </div>
    </div>
  </div>

  <script>
    // Aapki Google AI Studio se mila key:
    const PUBLIC_GEMINI_API_KEY = "AQ.Ab8RN6KIlt1777gE6m74lHaexOWEQqvYdYfxOqskE9fzdMTuWw"; 

    // System Instructions - Founder & Persona Context
    const SYSTEM_INSTRUCTIONS = `
    Aapka naam "Abdul AI" hai.
    Aapke creator aur founder "Abdul Samad" hain.
    Jab bhi koi user poochhe ki "Who is the founder of this AI?", "Who created you?", ya isse milta-julta koi sawaal, toh aapko spasht roop se batana hai ki "Abdul Samad is the founder and creator of Abdul AI".
    Aap sabhi tarah ke sawalon, images, audio, video, aur documents ko process karke madad kar sakte hain.
    `;

    let selectedFileBase64 = null;
    let selectedFileMime = null;

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedFileBase64 = e.target.result.split(',')[1];
        selectedFileMime = file.type;
        document.getElementById('file-name').innerText = file.name;
        document.getElementById('file-preview').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function removeFile() {
      selectedFileBase64 = null;
      selectedFileMime = null;
      document.getElementById('file-input').value = '';
      document.getElementById('file-preview').style.display = 'none';
    }

    function startNewChat() {
      const chatContainer = document.getElementById('chat-container');
      chatContainer.innerHTML = `
        <div class="starter-screen" id="starter-screen">
          <div class="starter-title">Hello, I am Abdul AI</div>
          <p style="color: #8e918f;">How can I help you today?</p>
        </div>
      `;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();

      if (!text && !selectedFileBase64) return;

      const starter = document.getElementById('starter-screen');
      if (starter) starter.remove();

      // User Message UI
      appendMessage('user', text, selectedFileBase64, selectedFileMime);

      // Clear Inputs
      inputEl.value = '';
      const sentBase64 = selectedFileBase64;
      const sentMime = selectedFileMime;
      removeFile();

      // Create AI Typing Message Placeholder
      const aiMsgDiv = appendMessage('ai', 'Abdul AI is thinking...');

      try {
        const responseText = await callGeminiAPI(text, sentBase64, sentMime);
        aiMsgDiv.querySelector('.message-content').innerText = responseText;
      } catch (error) {
        aiMsgDiv.querySelector('.message-content').innerText = "Error: " + error.message;
      }
    }

    function appendMessage(sender, text, fileBase64 = null, mimeType = null) {
      const chatContainer = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';

      const isUser = sender === 'user';
      const avatarClass = isUser ? 'user-avatar' : 'ai-avatar';
      const avatarLabel = isUser ? 'U' : 'AI';

      let mediaHTML = '';
      if (fileBase64 && mimeType) {
        if (mimeType.startsWith('image/')) {
          mediaHTML = `<br><img src="data:${mimeType};base64,${fileBase64}" class="message-media" />`;
        } else if (mimeType.startsWith('video/')) {
          mediaHTML = `<br><video src="data:${mimeType};base64,${fileBase64}" controls class="message-media"></video>`;
        } else if (mimeType.startsWith('audio/')) {
          mediaHTML = `<br><audio src="data:${mimeType};base64,${fileBase64}" controls></audio>`;
        }
      }

      msgDiv.innerHTML = `
        <div class="avatar ${avatarClass}">${avatarLabel}</div>
        <div class="message-content">${text}${mediaHTML}</div>
      `;

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    async function callGeminiAPI(prompt, fileBase64, mimeType) {
      // Local Founder Check for instant response
      const lower = prompt.toLowerCase();
      if (lower.includes("founder") || lower.includes("who created") || lower.includes("kisne banaya")) {
        return "Abdul Samad is the founder and creator of Abdul AI.";
      }

      // Build payload
      const parts = [];
      parts.push({ text: `System Instruction: ${SYSTEM_INSTRUCTIONS}\n\nUser Question: ${prompt}` });

      if (fileBase64 && mimeType) {
        parts.push({
          inline_data: {
            mime_type: mimeType,
            data: fileBase64
          }
        });
      }

      const payload = { contents: [{ parts: parts }] };

      // Attempt 1: Via Authorization Header (Supported for AQ. keys)
      try {
        const res1 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${PUBLIC_GEMINI_API_KEY}`,
            'x-goog-api-key': PUBLIC_GEMINI_API_KEY
          },
          body: JSON.stringify(payload)
        });

        if (res1.ok) {
          const data1 = await res1.json();
          return data1.candidates[0].content.parts[0].text;
        }
      } catch (e) {}

      // Attempt 2: Fallback Query Param
      const res2 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${PUBLIC_GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data2 = await res2.json();

      if (!res2.ok) {
        throw new Error(data2.error?.message || `API Error (${res2.status}). If running locally, please upload to GitHub Pages / Live Server.`);
      }

      return data2.candidates[0].content.parts[0].text;
    }
  </script>
</body>
</html>
